# Tipos: inspección de guiones; rendimiento y estrés sólo en ejecución controlada.
# Reutilizado por PR/merge. La inspección no mide capacidad y no crea artefactos.
name: Rendimiento y estrés

on:
  workflow_call:
    inputs:
      run_measurement:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      run_measurement:
        description: Ejecutar una medición real además de inspeccionar los guiones
        type: boolean
        default: true
      scenario:
        type: choice
        options: [load, stress]
        default: load
      api_base_url:
        description: API propia aislada; no Render compartido ni Mercado Pago
        type: string
        required: true
      product_id:
        description: ID de producto de prueba conocido
        type: string
        required: true
      backend_commit:
        description: Commit desplegado en el entorno aislado
        type: string
        required: true
      isolated_api:
        description: Confirmo que es un entorno propio y aislado
        type: boolean
        default: false
      p95_limit_ms:
        description: Umbral P95 justificado; vacío para obtener línea base
        type: string
      error_rate_limit:
        description: Tasa máxima de errores justificada de 0 a 1
        type: string
      threshold_reason:
        description: Justificación de umbrales a partir de la línea base
        type: string

permissions:
  contents: read

jobs:
  inspect:
    name: Inspeccionar guiones sin ejecutar carga
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.3.0'
      - name: Validar guiones y mostrar su alcance
        run: |
          k6 inspect tests/performance/load.js
          k6 inspect tests/performance/stress.js
          echo '## Rendimiento y estrés' >> "$GITHUB_STEP_SUMMARY"
          echo 'Guiones válidos. No se ejecutó carga ni se midió capacidad o recuperación.' >> "$GITHUB_STEP_SUMMARY"

  measure:
    name: Medir escenario y comprobar umbrales
    needs: inspect
    if: github.event_name == 'workflow_dispatch' && inputs.run_measurement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.3.0'
      - name: Ejecutar únicamente contra la API aislada confirmada
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          PRODUCT_ID: ${{ inputs.product_id }}
          BACKEND_COMMIT: ${{ inputs.backend_commit }}
          ISOLATED_API: ${{ inputs.isolated_api }}
          SCENARIO: ${{ inputs.scenario }}
          P95_LIMIT_MS: ${{ inputs.p95_limit_ms }}
          ERROR_RATE_LIMIT: ${{ inputs.error_rate_limit }}
          THRESHOLD_REASON: ${{ inputs.threshold_reason }}
        run: |
          test "$ISOLATED_API" = 'true' || { echo 'Falta confirmar el entorno aislado.'; exit 2; }
          case "$GITHUB_REF_NAME" in develop|release/*) ;; *) echo 'Ejecutar mediciones desde develop o release/*.'; exit 2 ;; esac
          case "$SCENARIO" in load|stress) ;; *) exit 2 ;; esac
          mkdir -p test-results
          k6 run "tests/performance/$SCENARIO.js"
      - name: Conservar resultados medidos, incluidos umbrales fallidos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: performance-measurement
          path: test-results/performance-*.json
          if-no-files-found: warn
          retention-days: 14
