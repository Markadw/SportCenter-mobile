# Tipos: inspección automática; referencia, carga y esfuerzo sólo en la copia aislada.
# Las mediciones usan el backend fijado y los criterios acordados del perfil versionado.
name: Rendimiento y estrés
on:
  workflow_call:
    inputs:
      run_measurement:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      run_measurement:
        description: Ejecutar mediciones reales en la copia local de CI
        type: boolean
        default: true
      scenario:
        type: choice
        options: [all, baseline, load, stress]
        default: all
permissions:
  contents: read
jobs:
  inspect:
    name: Inspeccionar guiones sin ejecutar carga
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.3.0'
      - name: Validar guiones y mostrar su alcance
        run: |
          k6 inspect tests/performance/load.js
          k6 inspect tests/performance/stress.js
          echo '## Rendimiento y estrés' >> "$GITHUB_STEP_SUMMARY"
          echo 'Guiones válidos. La inspección no mide capacidad ni recuperación.' >> "$GITHUB_STEP_SUMMARY"
  measure:
    name: Medir escenario y comprobar umbrales
    needs: inspect
    if: github.event_name == 'workflow_dispatch' && inputs.run_measurement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Medir contra el backend y PostgreSQL aislados de esta ejecución
        env:
          SCENARIO: ${{ inputs.scenario || 'all' }}
        run: |
          case "$GITHUB_REF_NAME" in develop|feature/*|fix/*|chore/*|test/*|release/*|hotfix/*) ;; *) echo 'Medir desde integración o una rama de trabajo.'; exit 2 ;; esac
          node scripts/run-performance.js
      - name: Conservar resultados medidos, incluidos fallos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: performance-measurement
          path: |
            test-results/performance/
            test-results/local-environment.json
          if-no-files-found: warn
          retention-days: 14
      - name: Detener la copia aislada
        if: always()
        run: node scripts/test-environment.js stop
