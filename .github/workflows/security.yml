# Una sola ejecución por integración; no crea un segundo push/PR ni una programación.
name: Seguridad móvil

on:
  workflow_call:
    inputs:
      keep_evidence:
        type: boolean
        default: false

jobs:
  scan:
    name: Dependencias y SAST CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Instalar exactamente el lockfile
        id: install
        run: npm ci --no-audit --no-fund
      - name: Auditar dependencias y bloquear críticas sin corregir automáticamente
        id: audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p test-results/security
          audit_exit=0
          npm audit --json --audit-level=critical > test-results/security/npm-audit.json || audit_exit=$?
          node scripts/evaluate-security.js audit test-results/security/npm-audit.json "$audit_exit"
      - name: Inicializar SAST oficial de JavaScript y TypeScript
        id: init
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analizar y subir SARIF a GitHub Security
        id: analyze
        if: ${{ !cancelled() && steps.init.outcome == 'success' }}
        uses: github/codeql-action/analyze@v4
        with:
          output: test-results/security/codeql
          category: /language:javascript-typescript
          upload: always
          upload-database: false
          wait-for-processing: true
      - name: Bloquear SARIF ausente, inválido o con hallazgos altos y críticos
        id: sast
        if: ${{ !cancelled() }}
        run: node scripts/evaluate-security.js sast test-results/security/codeql
        env:
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
      - name: Publicar resumen y comprobar resultados reales
        if: always()
        run: node scripts/evaluate-security.js summary
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          INIT_OUTCOME: ${{ steps.init.outcome }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          SAST_OUTCOME: ${{ steps.sast.outcome }}
      - name: Conservar diagnóstico compacto o evidencia de candidata
        if: ${{ !cancelled() && (failure() || inputs.keep_evidence) }}
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: |
            test-results/security/summary.md
            test-results/security/audit-gate.json
            test-results/security/sast-gate.json
          if-no-files-found: error
          retention-days: 14
