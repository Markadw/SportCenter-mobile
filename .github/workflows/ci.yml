# Tipos: análisis estático, unitarias/componentes, integración simulada y regresión.
# Push de trabajo: respuesta rápida. PR/merge: reutilizado por api-android.yml.
name: Calidad del cliente móvil

on:
  push:
    branches: ['feature/**', 'fix/**', 'chore/**', 'test/**', 'release/**', 'hotfix/**']
  workflow_call:
    inputs:
      keep_evidence:
        description: Conservar informes compactos de la candidata de entrega
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: client-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/chore/') || startsWith(github.ref, 'refs/heads/test/') }}

jobs:
  validate:
    name: Análisis estático y pruebas del cliente
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Instalar dependencias del lockfile
        id: install
        run: npm ci --no-audit --no-fund
      - name: Análisis estático con ESLint
        id: lint
        run: npm run lint
      - name: Análisis estático con TypeScript
        id: types
        run: npm run typecheck
      - name: Unitarias, componentes, integración simulada y regresión
        id: tests
        run: npm run test:ci
      - name: Validar matriz, dependencias y configuración de pruebas
        id: config
        run: npm run test:config
      - name: Mostrar resultados por tipo, incluidos fallos y omisiones
        if: always()
        run: node scripts/write-test-summary.js
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPES_OUTCOME: ${{ steps.types.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          CONFIG_OUTCOME: ${{ steps.config.outcome }}
      - name: Conservar diagnóstico o evidencia de entrega
        if: ${{ !cancelled() && (failure() || inputs.keep_evidence == true) }}
        uses: actions/upload-artifact@v4
        with:
          name: client-evidence
          path: |
            test-results/client-summary.md
            test-results/jest.json
            coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 14
