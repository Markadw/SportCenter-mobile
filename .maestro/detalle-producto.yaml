appId: ${APP_ID}
name: CP-04 detalle publico en Android
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Explora por deporte"
    timeout: 45000
- tapOn: "Catálogo"
- extendedWaitUntil:
    visible: "Buscar en el catálogo"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: ${PRODUCT_NAME}
    direction: DOWN
    timeout: 30000
- tapOn: ${PRODUCT_NAME}
- extendedWaitUntil:
    visible: "Compartir producto"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Descripción"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: "Descripción"
- takeScreenshot: cp04-descripcion
- scrollUntilVisible:
    element:
      text: "Categoría"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: "Categoría"
- takeScreenshot: cp04-categoria
