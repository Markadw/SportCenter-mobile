appId: ${APP_ID}
name: CP-03 catalogo publico en Android
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Explora por deporte"
    timeout: 45000
- takeScreenshot: cp03-inicio
- assertVisible:
    text: "^Catálogo$"
    enabled: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Catálogo"
- extendedWaitUntil:
    visible: "Buscar en el catálogo"
    timeout: 30000
- assertVisible: "Filtros"
- takeScreenshot: cp03-catalogo
