appId: ${APP_ID}
name: CP-03 catalogo publico en Android
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Marcas"
    timeout: 45000
- assertVisible: "Ver todas"
- takeScreenshot: cp03-inicio
- tapOn: "Ver todas"
- extendedWaitUntil:
    visible: "Catálogo de Productos"
    timeout: 30000
- assertVisible: "Filtros"
- takeScreenshot: cp03-catalogo
